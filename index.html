<!DOCTYPE html>

    <title>Портфоліо – Прохоров Артем</title>

<body>

        </div>

        <!-- Рядок сітки для основного контенту -->

            <!-- Ліва колонка: Про мене -->

                    <ul>
                        <li>Створення креслень та робота в середовищі AutoCAD</li>

                    </ul>

                    <h2 class="mt-4">Контакти</h2>
                    <p>portfolio: <a href="https://github.com/dez1533/portfolio" target="_blank">GitHub</a></p>
                    <p>загальне портфоліо: <a href="https://porokhovnichenkoiryna.github.io/kn-2026/" target="_blank">ІнЗП 2026</a></p>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
